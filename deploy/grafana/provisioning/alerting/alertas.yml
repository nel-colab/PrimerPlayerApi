# Alertas de Runagard (Grafana Alerting), enviadas por correo vía Brevo (GF_SMTP_* en docker-compose.ops.yml).
# El destino sale de ALERTAS_DESTINO en deploy/.env (varios correos: separados por ";").
# En los archivos de provisioning, "$$" es un "$" literal (un "$" solo se interpreta como variable de entorno).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: correo-runagard
    receivers:
      - uid: correo-runagard
        type: email
        disableResolveMessage: false
        settings:
          addresses: ${ALERTAS_DESTINO}
          singleEmail: true
          subject: '{{ template "default.title" . }}'

policies:
  - orgId: 1
    receiver: correo-runagard
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: runagard
    folder: Runagard
    interval: 1m
    rules:
      - uid: runagard-servicio-caido
        title: Servicio caído
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels: { severidad: critica }
        annotations:
          summary: "{{ $$labels.job }} no responde"
          description: >-
            Prometheus no logra leer «{{ $$labels.job }}» hace más de 2 minutos.
            Revisa: cd /opt/runagard/deploy && docker compose ps (o docker compose -f docker-compose.ops.yml ps).
          runbook_url: https://grafana.runagard.cl/d/runagard-resumen
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: "min by (job) (up)", instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      - uid: runagard-disco-lleno
        title: Disco del VPS sobre 85 %
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels: { severidad: alta }
        annotations:
          summary: "Disco al {{ printf \"%.0f\" $$values.A.Value }} %"
          description: >-
            Libera espacio: imágenes Docker sin uso (docker image prune -a), respaldos antiguos o logs.
            Si la tienda sigue creciendo, agrega almacenamiento en Contabo.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                100 * (1 - max(node_filesystem_avail_bytes{job="vps",mountpoint="/",fstype!~"tmpfs|overlay"})
                / max(node_filesystem_size_bytes{job="vps",mountpoint="/",fstype!~"tmpfs|overlay"}))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [85] } }]

      - uid: runagard-memoria-alta
        title: Memoria RAM sobre 90 %
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels: { severidad: alta }
        annotations:
          summary: "RAM al {{ printf \"%.0f\" $$values.A.Value }} % por más de 10 minutos"
          description: >-
            Revisa en Grafana → Runagard · Resumen → «Memoria por contenedor» quién consume más.
            Lo habitual es un build de Jenkins o SonarQube; si se repite, mover CI/CD a otro VPS.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 * (1 - node_memory_MemAvailable_bytes{job="vps"} / node_memory_MemTotal_bytes{job="vps"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [90] } }]

      - uid: runagard-cpu-alta
        title: CPU sobre 90 %
        condition: C
        for: 15m
        noDataState: NoData
        execErrState: Error
        labels: { severidad: media }
        annotations:
          summary: "CPU al {{ printf \"%.0f\" $$values.A.Value }} % por más de 15 minutos"
          description: "Revisa «CPU por contenedor» en Runagard · Resumen."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 * (1 - avg(rate(node_cpu_seconds_total{job="vps",mode="idle"}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [90] } }]

      - uid: runagard-api-errores
        title: Errores 5xx en la API
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidad: alta }
        annotations:
          summary: "{{ printf \"%.0f\" $$values.A.Value }} errores 5xx de la API en 10 minutos"
          description: "Detalle en Grafana → Runagard · Logs (servicio api, contiene: ERROR)."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(http_server_requests_seconds_count{job="api",status=~"5.."}[10m])) or vector(0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [5] } }]

      - uid: runagard-pipeline-fallido
        title: Pipeline de Jenkins fallido
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidad: media }
        annotations:
          summary: "Falló el último build de {{ $$labels.jenkins_job }}"
          description: >-
            Lo que estaba desplegado sigue funcionando (si el despliegue falla, Jenkins vuelve a la versión anterior).
            Revisa el log en https://jenkins.runagard.cl/job/{{ $$labels.jenkins_job }}/lastBuild/console
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max by (jenkins_job) (default_jenkins_builds_last_build_result_ordinal)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [1] } }]
