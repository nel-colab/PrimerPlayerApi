# Desarrollo local: PostgreSQL, MinIO (S3), Mailpit (correo de prueba) y pgAdmin (visor web de la base).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: primerplayer
      POSTGRES_USER: pp
      POSTGRES_PASSWORD: pp
      TZ: UTC
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pp -d primerplayer"]
      interval: 5s
      retries: 10

  minio:
    # Las imágenes oficiales minio/minio y minio/mc ya no se publican (sep. 2026).
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"                          # solo en desarrollo: evita problemas de permisos en el volumen
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ppminio
      MINIO_ROOT_PASSWORD: ppminio123
    ports: ["9000:9000", "9001:9001"]   # API S3 y consola web
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]   # SMTP y bandeja web en http://localhost:8025

  pgadmin:
    # Visor web de la base: http://localhost:5050 (sin login, conexión ya registrada).
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@primerplayer.cl
      PGADMIN_DEFAULT_PASSWORD: dev
      PGADMIN_CONFIG_SERVER_MODE: "False"                    # modo escritorio: entra directo, sin login
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ENABLE_SERVER_PASS_EXEC_CMD: "True"     # permite la clave de servers.json (solo desarrollo)
    ports: ["5050:80"]
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  pgadmindata:
