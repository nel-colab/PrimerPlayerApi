# Perfil de producción (SPRING_PROFILES_ACTIVE=prod). Los secretos y URLs llegan por variables de entorno desde
# deploy/.env (ver deploy/.env.example); aquí solo va lo que cambia de comportamiento respecto de desarrollo.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  # Detrás de Caddy: toma la IP real del cliente y el esquema https de X-Forwarded-* (bloqueo de login, auditoría,
  # URLs absolutas). "native" solo confía en proxies de redes privadas (la red de Docker).
  forward-headers-strategy: native
  shutdown: graceful

management:
  server:
    port: 8081            # Actuator solo dentro de la red de Docker: Caddy publica /api del 8080, nunca el 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: primer-player-api

springdoc:                # sin Swagger público en producción
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

pp:
  auth:
    cookie:
      segura: true        # solo HTTPS
  notificaciones:
    url-front: ${PP_URL_FRONT}
    remitente: ${PP_MAIL_REMITENTE}   # del dominio verificado en el proveedor SMTP (SPF/DKIM), o caen en spam

logging:
  level:
    root: info
    org.hibernate.SQL: warn
